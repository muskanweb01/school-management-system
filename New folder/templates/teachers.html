<!DOCTYPE html>
<html>
<head>
    <title>Teachers Management</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="header">
    <h1>👩‍🏫 Teachers Management</h1>
    <a href="/">← Back to Dashboard</a>
</div>

<div class="container">
<h2>Add Teacher</h2>

<form method="POST" action="/add_teacher">

    <input type="text" name="name" placeholder="Teacher Name" required>

    <input type="text" name="teacher_id" placeholder="Teacher ID" required>

    <input type="text" name="subject" placeholder="Subject" required>

    <input type="text" name="class_name" placeholder="Class" required>

    <input type="text" name="phone" placeholder="Phone Number">

    <br><br>

    <button type="submit">Add Teacher</button>

</form>

<br>
    <h2>Teachers Records</h2>

    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Subject</th>
            <th>Phone</th>
        </tr>

        {% for teacher in teachers %}
        <tr>
            <td>{{ teacher['id'] }}</td>
            <td>{{ teacher['name'] }}</td>
            <td>{{ teacher['subject'] }}</td>
            <td>{{ teacher['phone'] }}</td>
        </tr>
        {% endfor %}

    </table>

</div>

</body>
</html>
