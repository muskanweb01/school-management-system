<!DOCTYPE html>
<html>
<head>
    <title>School Management System</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="header">
        <h1>🏫 School Management System</h1>
        <p>Admin Dashboard</p>
    </div>

    <div class="container">

        <h2>Dashboard</h2>

        <div class="cards">

            <div class="card">
                <a href="/students">
                    <span class="icon">👩‍🎓</span>
                    Students
                </a>
            </div>

            <div class="card">
                <a href="/attendance">
                    <span class="icon">✅</span>
                    Attendance
                </a>
            </div>

            <div class="card">
                <a href="/teachers">
                    <span class="icon">👨‍🏫</span>
                    Teachers
                </a>
            </div>

            <div class="card">
                <a href="/classes">
                    <span class="icon">🏫</span>
                    Classes
                </a>
            </div>

            <div class="card">
                <a href="/marks">
                    <span class="icon">📝</span>
                    Marks / Results
                </a>
            </div>

            <div class="card">
                <a href="/report">
                    <span class="icon">📊</span>
                    Attendance Reports
                </a>
            </div>

        </div>

    </div>

</body>
</html>
