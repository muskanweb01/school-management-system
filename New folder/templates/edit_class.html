<!DOCTYPE html>
<html>
<head>
    <title>Edit Class</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="header">
    <h1>✏️ Edit Class</h1>
    <a href="/classes">← Back to Classes</a>
</div>

<div class="container">

    <div class="form-box">

        <form method="POST">

            <input
                type="text"
                name="class_name"
                value="{{ class_item['class_name'] }}"
                placeholder="Class Name"
                required
            >

            <input
                type="text"
                name="section"
                value="{{ class_item['section'] or '' }}"
                placeholder="Section"
            >

            <input
                type="text"
                name="teacher_name"
                value="{{ class_item['teacher_name'] or '' }}"
                placeholder="Teacher Name"
            >

            <br><br>

            <button type="submit">
                Update Class
            </button>

        </form>

    </div>

</div>

</body>
</html>
